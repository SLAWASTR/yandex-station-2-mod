pcm.!default {
  type asym
  playback.pcm "dmix_spk_plug"
  capture.pcm "hw_feedback_and_mics"
}

pcm.soft_volume {
  type softvol
  slave.pcm "dmix_spk_plug"

  control {
    name "Master Playback Volume"
  }
}

ctl.equal {
  type equal;
  controls "/data/alsaequal_state.bin"
}

pcm.plugequal {
  type equal;
  controls "/data/alsaequal_state.bin"
  slave.pcm "dmix_spk_plug";
}

pcm.equal{
  type plug;
  slave.pcm plugequal;
}

pcm.hw_feedback_and_mics_raw {
    type route
    slave.pcm "hw:0,2"
    slave.channels 16
    ttable.0.0 1
    ttable.1.2 1
    ttable.2.4 1
    ttable.3.7 1
    ttable.4.8 1
    ttable.5.9 1
    ttable.6.6 1
}

pcm.capture_fault_inject {
  type fault_inject
  slave.pcm "hw_feedback_and_mics_raw"
}

pcm.hw_feedback_and_mics {
  type audio_metrics
  tap "capture"
  chunk_frames 1536
  slave.pcm "capture_fault_inject"
}

pcm.multi_capture {
  type multi
  slaves {
    mics     { pcm "hw:0,2"; channels 8 }
    loopback { pcm "hw:0,1"; channels 2 }
  }
  bindings {
    0 { slave mics;     channel 0 }
    1 { slave mics;     channel 2 }
    2 { slave mics;     channel 4 }
    3 { slave mics;     channel 7 }
    4 { slave loopback; channel 0 }
    5 { slave loopback; channel 1 }
    6 { slave mics;     channel 6 }
  }
}

pcm.bluetooth {
  type softvol
  slave.pcm "dmix_spk_plug"
  control {
    name "Bluetooth Master Playback Volume"
    card 0
  }
}

pcm.dmix_spk_plug {
  type plug
  slave.pcm "playback_metrics_tap"
}

pcm.playback_metrics_tap {
  type audio_metrics
  tap "playback"
  chunk_frames 1536
  slave.pcm "dmix_spk"
}

pcm.dmix_spk {
  type dmix
  ipc_key 1024
  ipc_key_add_uid false
  ipc_perm 0666
  slave {
    pcm "hw:0,0"
    channels 2
    buffer_size 7680
    period_size 960
  }
}

pcm.spotify {
    type plug
    slave.pcm "dmix_spk"
}
